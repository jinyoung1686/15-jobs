<html>
  <head> </head>
  <body>
    <div>
      <h1>검색결과</h1>
      <p>인크루트, 잡코리아에서 검색한 결과입니다.</p>
      <a href="/file?keyword={{keyword}}">
        <button>csv 다운로드</button>
      </a>
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>회사</th>
            <th>공고제목</th>
            <th>지역</th>
          </tr>
        </thead>
        <tbody>
          {% for i, job in jobs %}
          <tr>
            <td>{{ i + 1 }}</td>
            <td>{{ job["company"] }}</td>
            <td>
              <a target="blank" href="{{ job['link']}}"></a>{{job["title"]}}
            </td>
            <td>{{ job["location"] }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
